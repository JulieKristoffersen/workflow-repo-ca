<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Holidaze Venue Booking</title>
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/main.js"></script>
  </head>

  <body class="bg-gray-100">
    <header class="bg-green-800 text-white py-4">
      <nav id="menu-container" class="container mx-auto px-6">
    <nav class="flex justify-between items-center p-4 bg-green-800">
      <div class="flex items-center space-x-4">
        <a href="/" class="text-white hover:text-blue-200 py-2 px-3 font-medium transition-colors duration-200 ">Logo</a>

      </div>
      <div class="flex items-center space-x-4">
      <a href="/" class="text-white hover:text-blue-200 py-2 px-3 font-medium transition-colors duration-200 ">Home</a>
        <a href="/login" class="text-blue-300 py-2 px-3 font-medium transition-colors duration-200 font-bold">Login</a>
        <a href="/register" class="text-white hover:text-blue-200 py-2 px-3 font-medium transition-colors duration-200 ">Register</a>
      </div>
    </nav>
  </nav>
    </header>
    <main class="container mx-auto mt-8 px-4 flex-grow">
      <section class="max-w-md mx-auto">
        <h1 class="text-3xl font-bold mb-4 text-gray-800">Login</h1>
        <div id="message-container" class="mb-4"></div>
        <form id="loginForm" class="bg-white shadow-md rounded-lg p-8" novalidate="">
          <fieldset>
            <div class="mb-4">
              <input name="email" type="email" required="" placeholder="Email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" style="">
            </div>
            <div class="mb-6">
              <input name="password" type="password" required="" minlength="8" placeholder="Password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" style="">
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition duration-200">
              Login
            </button>
          </fieldset>
        </form>
      </section>
    </main>
  <!-- Code injected by live-server -->
<script type="text/javascript">
	// <![CDATA[  <-- For SVG support
	if ('WebSocket' in window) {
		(function() {
			function refreshCSS() {
				var sheets = [].slice.call(document.getElementsByTagName("link"));
				var head = document.getElementsByTagName("head")[0];
				for (var i = 0; i < sheets.length; ++i) {
					var elem = sheets[i];
					head.removeChild(elem);
					var rel = elem.rel;
					if (elem.href && typeof rel != "string" || rel.length == 0 || rel.toLowerCase() == "stylesheet") {
						var url = elem.href.replace(/(&|\?)_cacheOverride=\d+/, '');
						elem.href = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_cacheOverride=' + (new Date().valueOf());
					}
					head.appendChild(elem);
				}
			}
			var protocol = window.location.protocol === 'http:' ? 'ws://' : 'wss://';
			var address = protocol + window.location.host + window.location.pathname + '/ws';
			var socket = new WebSocket(address);
			socket.onmessage = function(msg) {
				if (msg.data == 'reload') window.location.reload();
				else if (msg.data == 'refreshcss') refreshCSS();
			};
			console.log('Live reload enabled.');
		})();
	}
	// ]]>
</script>


</body></html>
